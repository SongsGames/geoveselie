<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГеоВеселье — суперигры!</title>
<style>
:root{--ink:#25304a;--pink:#ff4fa3;--yellow:#ffd93d;--blue:#4d96ff;--green:#6bcb77;--purple:#9b5de5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff0a8,#ffcce6 45%,#b8f7ff)}
header{padding:24px 12px 12px;text-align:center}h1{font-size:clamp(32px,6vw,54px);margin:0;color:#6838a8;text-shadow:3px 4px 0 #ffe36d}.subtitle{font-size:18px;font-weight:bold;color:#536079;margin:8px}
main{width:min(980px,96vw);margin:0 auto 35px}.panel{background:#ffffffed;border:5px solid white;border-radius:28px;padding:clamp(15px,3vw,30px);box-shadow:0 12px 0 #6d57b344,0 20px 45px #44336622;text-align:center}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:15px 0}.gamecard{padding:20px 12px;border-radius:22px;border:4px solid white;box-shadow:0 7px 0 #26304a20;cursor:pointer;font-size:20px;font-weight:900;transition:.15s}.gamecard:hover{transform:translateY(-4px) rotate(-1deg)}.gamecard .emoji{font-size:48px;display:block;margin-bottom:8px}.c1{background:#ffe8a3}.c2{background:#c8f7d4}.c3{background:#ffd0e8}.c4{background:#cbe6ff}
button{font:900 18px "Trebuchet MS",Arial;cursor:pointer;border:0;border-radius:16px;padding:13px 17px;margin:6px;box-shadow:0 5px 0 #26304a26;transition:transform .12s}button:hover{transform:translateY(-3px)}button:active{transform:translateY(2px)}.choice{background:#4d96ff;color:white;min-width:min(230px,90%)}.choice:nth-child(2n){background:#ff4fa3}.choice:nth-child(3n){background:#8c62e8}.choice:nth-child(4n){background:#00a878}.primary{background:#ffd93d;color:#473700}.secondary{background:#e9e7ff;color:#4e3d91}
.sub{font-size:18px;font-weight:bold;color:#536079}.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px}.pill{background:#e8f7ff;border:2px solid #b9e8ff;border-radius:99px;padding:8px 13px;font-weight:bold}.big{font-size:clamp(23px,4vw,34px);font-weight:900;line-height:1.25;margin:18px 0}.feedback{font-size:21px;font-weight:900;min-height:32px;margin:12px}.progress{height:15px;border-radius:99px;background:#e8e9f5;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#6bcb77,#00c2ff,#ff4fa3);width:0%;transition:width .3s}.stage{min-height:150px;border:3px dashed #c5a7ff;border-radius:22px;padding:15px;margin:14px 0;background:#fcf9ff}.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}.room{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:15px auto}.object{font-size:38px;background:#fff0a8;border:3px solid #ffc83d;border-radius:20px;padding:12px;cursor:pointer;min-height:80px}.object.found{background:#c8f7d4;border-color:#56c77b}.map{position:relative;max-width:700px;height:145px;margin:12px auto;background:linear-gradient(160deg,#c8f8ff,#d9ffc8);border-radius:24px;border:3px solid white;overflow:hidden}.island{position:absolute;font-size:31px;cursor:pointer;transition:.2s}.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:650px;margin:16px auto}.mem{min-height:88px;font-size:clamp(19px,3vw,29px);background:linear-gradient(135deg,#b8f7ff,#e6d5ff);border:3px solid white;border-radius:18px;cursor:pointer}.mem.open{background:#fff0a8}.mem.matched{background:#c8f7d4;opacity:.85}.blast{font-size:58px;animation:bob 1.2s infinite alternate}@keyframes bob{to{transform:translateY(-7px) rotate(5deg)}}[hidden]{display:none!important}
</style></head>
<body>
<header><h1>🌈 ГеоВеселье! 🌍</h1><p class="subtitle">Четыре суперигры для маленьких исследователей ⭐</p></header>
<main><section class="panel" id="home">
<div style="font-size:28px">🎈 🐸 🚀 🦄 🎈</div><h2>Во что играем?</h2><p class="sub">Выбирай игру и собирай звёздочки!</p>
<div class="menu">
<button class="gamecard c1" onclick="start('escape')"><span class="emoji">🚪🔑</span>Волшебный побег<small style="display:block;font-size:14px;margin-top:7px">Ищи предметы и ключи</small></button>
<button class="gamecard c2" onclick="start('route')"><span class="emoji">🐸🏝️</span>Радужный маршрут<small style="display:block;font-size:14px;margin-top:7px">Прыгай по островам</small></button>
<button class="gamecard c3" onclick="start('memory')"><span class="emoji">🃏🧠</span>Найди пару<small style="display:block;font-size:14px;margin-top:7px">Открывай карточки</small></button>
<button class="gamecard c4" onclick="start('blast')"><span class="emoji">🚀💥</span>Правда-бластер<small style="display:block;font-size:14px;margin-top:7px">Лови правильные ответы</small></button>
</div><p class="sub">💡 Работает без интернета. Можно играть мышкой или пальцем на сенсорном экране.</p>
</section>
<section class="panel" id="game" hidden>
<div class="row" style="justify-content:space-between"><button class="secondary" onclick="goHome()">⬅️ К выбору игр</button><span class="pill" id="gameLabel">Игра</span></div>
<div id="play"></div>
</section></main>
<script>
const $=id=>document.getElementById(id);let game='',state={};
const qsEscape=[
["Что показывает карта?",["Места и объекты 🗺️","Рецепт 🍲","Мультик 📺"],0],
["Какой цвет часто обозначает воду?",["Синий 💧","Красный ❤️","Жёлтый 🌟"],0],
["Что такое глобус?",["Модель Земли 🌍","Мяч ⚽","Луна 🌙"],0],
["Зачем нужны условные знаки?",["Объяснять объекты на карте 🔎","Украшать тетрадь 🎀","Считать конфеты 🍬"],0],
["Для чего нужен масштаб?",["Показывает, во сколько раз уменьшено расстояние 📏","Показывает погоду 🌦️","Считает дни 📅"],0]];
const qsRoute=[
["Что помогает определить стороны света?",["🧭 Компас","🥄 Ложка","🧸 Мишка"],0],
["Что можно увидеть на физической карте?",["⛰️ Горы и реки","🍕 Пиццу","🎮 Игрушки"],0],
["Какой цвет часто обозначает воду?",["💙 Синий","❤️ Красный","💛 Жёлтый"],0],
["Глобус по форме похож на…",["⚽ Шар","📦 Коробку","🔺 Треугольник"],0],
["Атлас — это…",["📚 Книга с картами","🧦 Носок","🍉 Арбуз"],0]];
const qsBlast=[
["Глобус — это модель Земли.",true],["Атлас — книга с картами.",true],["Реки часто показывают синим цветом.",true],["Масштаб помогает сравнивать расстояния.",true],["Компас помогает находить стороны света.",true],["На карте лес всегда обозначают конфетой.",false],["Карта и глобус — одно и то же.",false],["Условные знаки помогают читать карту.",true],["Меридианы идут от полюса к полюсу.",true],["На глобусе изображена только Европа.",false]];
function start(which){game=which;$('home').hidden=true;$('game').hidden=false;state={i:0,score:0,lock:false,found:new Set(),first:null,second:null,moves:0,matched:0,combo:0};$('play').innerHTML='';$('gameLabel').textContent=({escape:'🚪 Волшебный побег',route:'🐸 Радужный маршрут',memory:'🃏 Найди пару',blast:'🚀 Правда-бластер'})[which];if(which==='escape')renderEscape();if(which==='route')renderRoute();if(which==='memory')initMemory();if(which==='blast')renderBlast()}
function goHome(){$('game').hidden=true;$('home').hidden=false;game=''}
function topHud(label,score='⭐ 0'){return `<div class="hud"><span class="pill">${label}</span><span class="pill" id="score">${score}</span></div>`}
function renderEscape(){
$('play').innerHTML=`<div style="font-size:34px">🐱 🔑 🚪</div><p class="sub">Нажимай на предметы в комнате, ищи вопросы и собирай ключи!</p>${topHud('🔑 Ключи: <span id="keys">0</span>/5')}<div class="progress"><div class="bar" id="bar"></div></div><div class="room" id="room"></div><div class="stage"><div class="big" id="q">Найди спрятанный вопрос!</div><div class="row" id="answers"></div><div class="feedback" id="msg"></div></div><button class="primary" onclick="start('escape')">🔄 Заново</button>`;
let objs=['🧸','🪴','🖼️','🧺','🪑','🧸','🪟','📦','🪄'];state.order=[...Array(9).keys()].sort(()=>Math.random()-.5);$('room').innerHTML=state.order.map((n,p)=>`<button class="object" onclick="pickObject(${p},this)">${objs[n]}</button>`).join('');
}
function pickObject(pos,btn){if(btn.classList.contains('found')||state.found.size>=5)return;let i=state.found.size,q=qsEscape[i];$('q').textContent=q[0];$('answers').innerHTML=q[1].map((a,j)=>`<button class="choice" onclick="escapeAnswer(${j},${pos},this)">${a}</button>`).join('');$('msg').textContent='Выбери ответ!'}
function escapeAnswer(j,pos){if(state.lock)return;let q=qsEscape[state.found.size];if(j===q[2]){state.found.add(pos);state.score+=10;let btn=$('room').children[pos];btn.classList.add('found');btn.textContent='🔑';$('msg').textContent='Ключ найден! +10 очков ✨';$('msg').style.color='#07965b'}else{$('msg').textContent='Почти! Попробуй ещё раз 💪';return} $('keys').textContent=state.found.size;$('score').textContent='⭐ '+state.score;$('bar').style.width=state.found.size*20+'%';if(state.found.size===5){$('q').textContent='УРААА! Дверь открыта! 🏰';$('answers').innerHTML='<div class="big">🏆 🎉 🌈</div>'}}
function renderRoute(){$('play').innerHTML=`<div style="font-size:32px">🐸 🏝️ 🌈</div><p class="sub">Помоги лягушонку добраться до радуги!</p>${topHud('Остров 1/5')}<div class="map" id="map"></div><div class="stage"><div class="big" id="q"></div><div class="row" id="answers"></div><div class="feedback" id="msg"></div></div><button class="primary" id="next" hidden onclick="routeNext()">Дальше 🐸</button>`;routeShow()}
function routeShow(){state.lock=false;$('map').innerHTML=qsRoute.map((_,j)=>`<span class="island" style="left:${6+j*19}%;top:${j%2?72:20}px;opacity:${j<=state.i?1:.45}" onclick="if(${j}<=state.i)routeJump(${j})">${j<state.i?'✅':j===state.i?'🐸':'🏝️'}</span>`).join('');$('game').querySelector('.pill').textContent=`Остров ${state.i+1}/5`;let q=qsRoute[state.i];$('q').textContent=q[0];$('msg').textContent='';$('next').hidden=true;$('answers').innerHTML=q[1].map((a,j)=>`<button class="choice" onclick="routeAnswer(${j})">${a}</button>`).join('')}
function routeJump(j){state.i=j;routeShow()}
function routeAnswer(j){if(state.lock)return;state.lock=true;if(j===qsRoute[state.i][2]){state.score+=10;$('msg').textContent='Супер-прыжок! +10 очков 🌟'}else $('msg').textContent='Почти! Верный ответ: '+qsRoute[state.i][1][0];$('score').textContent='⭐ '+state.score;$('next').hidden=false;$('next').textContent=state.i===4?'Финиш! 🏆':'На следующий остров ➡️'}
function routeNext(){if(state.i<4){state.i++;routeShow()}else{$('q').textContent='ФИНИШ! Лягушонок дома! 🏡';$('answers').innerHTML='<div class="big">🏆 🌈 🎉</div>';$('msg').textContent='Ты заработал '+state.score+' очков!';$('next').textContent='Ещё путешествие 🔁';$('next').onclick=()=>start('route')}}
const pairData=[['🗺️','Карта'],['🌍','Глобус'],['💧','Вода'],['📚','Атлас'],['📏','Масштаб'],['🔎','Знаки']];
function initMemory(){state.deck=[];pairData.forEach((p,i)=>{state.deck.push({id:i,label:p[0]},{id:i,label:p[1]})});state.deck.sort(()=>Math.random()-.5);state.first=state.second=null;state.lock=false;state.moves=state.matched=0;$('play').innerHTML=`<p class="sub">Открывай карточки и находи пары по смыслу!</p>${topHud('👆 Ходы: <span id="moves">0</span>')}<div class="pill" id="pairs">💖 Пары: 0/6</div><div class="memory" id="board"></div><div class="feedback" id="msg">Найди пары!</div><button class="primary" onclick="start('memory')">Перемешать 🔀</button>`;drawMemory()}
function drawMemory(){$('board').innerHTML=state.deck.map((c,i)=>`<button class="mem ${c.open?'open':''} ${c.matched?'matched':''}" onclick="memoryPick(${i})">${c.open||c.matched?c.label:'❔'}</button>`).join('');$('moves').textContent=state.moves;$('pairs').textContent=`💖 Пары: ${state.matched}/6`}
function memoryPick(i){let c=state.deck[i];if(state.lock||c.open||c.matched)return;c.open=true;if(state.first===null)state.first=i;else{state.second=i;state.moves++;if(state.deck[state.first].id===state.deck[state.second].id){state.deck[state.first].matched=state.deck[state.second].matched=true;state.matched++;state.first=state.second=null;$('msg').textContent=state.matched===6?`ПОБЕДА! Все пары найдены за ${state.moves} ходов! 🏆`:'Есть пара! Ты суперсыщик! 🎉'}else{state.lock=true;$('msg').textContent='Не пара — попробуй запомнить картинки 🧠';setTimeout(()=>{state.deck[state.first].open=state.deck[state.second].open=false;state.first=state.second=null;state.lock=false;drawMemory()},850)}}drawMemory()}
function renderBlast(){$('play').innerHTML=`<div class="blast">🚀</div><p class="sub">Стреляй правильным ответом и собирай комбо!</p>${topHud('Раунд 1/10')}<div class="progress"><div class="bar" id="bar"></div></div><div class="stage"><div class="big" id="q"></div><button class="choice" onclick="blastAnswer(true)">Правда! 💚</button><button class="choice" onclick="blastAnswer(false)">Ложь! 💥</button><div class="feedback" id="msg"></div></div><button class="primary" id="next" hidden onclick="blastNext()">Следующий уровень ⏭️</button>`;blastShow()}
function blastShow(){state.lock=false;$('game').querySelector('.pill').textContent=`Раунд ${state.i+1}/10`;$('score').textContent=`⭐ ${state.score} · 🔥 ${state.combo}`;$('bar').style.width=state.i*10+'%';$('q').textContent=qsBlast[state.i][0];$('msg').textContent='';$('next').hidden=true}
function blastAnswer(v){if(state.lock)return;state.lock=true;if(v===qsBlast[state.i][1]){state.combo++;state.score+=10+Math.min(state.combo*2,10);$('msg').textContent=state.combo>=3?'КОМБО!!! 🌟🌟🌟':'ПОПАДАНИЕ! + очки 🎯'}else{state.combo=0;$('msg').textContent='БА-БАХ! Запомни правильный ответ 😄'}$('score').textContent=`⭐ ${state.score} · 🔥 ${state.combo}`;$('bar').style.width=(state.i+1)*10+'%';$('next').hidden=false;$('next').textContent=state.i===9?'Финиш! 🏆':'Следующий уровень ⏭️'}
function blastNext(){if(state.i<9){state.i++;blastShow()}else{$('q').textContent='КОСМИЧЕСКИЙ ЧЕМПИОН! 🪐';$('msg').textContent=`Твой результат: ${state.score} очков!`;$('next').textContent='Новый полёт 🚀';$('next').onclick=()=>start('blast')}}
</script></body></html>
